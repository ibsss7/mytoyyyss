<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Toys — Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Sweet Toys</div>
    <p class="tagline">Магазин самых уютных игрушек в Узбекистане</p>
</header>

<div class="container">
    <div class="catalog">

        <div class="product-card">
            <div class="image-box">
                <img src="photosss/toy1/toy1_1.jpg" class="main-img" onclick="openModal(this.src)">
                <div class="thumbnails">
                    <img src="photosss/toy1/toy1_1.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_2.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_3.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_4.jpg" onclick="changeImg(this)">
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-title">Gonchik moshina</h3>
                <ul class="product-features">
                    <li>Yosh: 3 yoshdan kattalar uchun</li>
                    <li>Ranglari: har xil</li>
                    <li>Material: Xavfsiz plastik</li>
                </ul>

                <button class="buy-btn select-btn" onclick="showQty(this)">Miqdorni tanlang</button>

                <div class="qty-box" style="display: none;">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty(this, -1, 1000)">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn" onclick="updateQty(this, 1, 1000)">+</button>
                    </div>
                    <div class="price"><span class="total-price">1 000</span> сум</div>
                    <a href="https://t.me/sweet_toys_uz" target="_blank" class="buy-btn cart-btn">V korzinu</a>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="image-box">
                <img src="photosss/toy2/toy2_1.jpg" class="main-img" onclick="openModal(this.src)">
            </div>
            <div class="product-info">
                <h3 class="product-title">Mishka Teddy</h3>
                <ul class="product-features">
                    <li>Yosh: 0+</li>
                    <li>Material: Yumshoq mato</li>
                </ul>

                <button class="buy-btn select-btn" onclick="showQty(this)">Miqdorni tanlang</button>

                <div class="qty-box" style="display: none;">
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty(this, -1, 5000)">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn" onclick="updateQty(this, 1, 5000)">+</button>
                    </div>
                    <div class="price"><span class="total-price">5 000</span> сум</div>
                    <a href="https://t.me/sweet_toys_uz" target="_blank" class="buy-btn cart-btn">V korzinu</a>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="myModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="imgFull">
</div>

<script>
    function changeImg(smallImg) {
        const fullImg = smallImg.closest('.image-box').querySelector(".main-img");
        fullImg.src = smallImg.src;
    }

    function openModal(src) {
        document.getElementById("myModal").style.display = "flex";
        document.getElementById("imgFull").src = src;
    }

    function closeModal() {
        document.getElementById("myModal").style.display = "none";
    }

    function showQty(btn) {
        btn.style.display = 'none';
        btn.parentElement.querySelector('.qty-box').style.display = 'block';
    }

    function updateQty(btn, change, unitPrice) {
        const info = btn.closest('.product-info');
        const qtySpan = info.querySelector('.qty-val');
        const priceSpan = info.querySelector('.total-price');
        
        let qty = parseInt(qtySpan.innerText) + change;
        if (qty < 1) qty = 1;
        
        qtySpan.innerText = qty;
        priceSpan.innerText = (qty * unitPrice).toLocaleString('ru-RU').replace(',', ' ');
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById("myModal")) closeModal();
    }
</script>
</body>
</html>
