<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Toys — Магазин оригинальных игрушек</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Sweet Toys</div>
    <p class="tagline">Магазин самых уютных игрушек в Узбекистане</p>
</header>

<div class="container">
    <div class="catalog">

        <div class="product-card">
            <div class="image-box">
                <img src="photosss/toy1/toy1_1.jpg" class="main-img" onclick="openModal(this.src)" alt="Игрушка от Sweet Toys">
                <div class="thumbnails">
                    <img src="photosss/toy1/toy1_1.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_2.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_3.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_4.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_5.jpg" onclick="changeImg(this)">
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-title">Название игрушки</h3>
                <p class="product-desc">Здесь описание товара. Обязательно укажите, почему Sweet Toys — это лучший выбор.</p>
                <div class="price">120 000 сум</div>
                <a href="https://t.me/sweet_toys_uz" target="_blank" class="buy-btn">Заказать в Telegram</a>
            </div>
        </div>

        </div>
</div>

<footer>
    <h3>Sweet Toys</h3>
    <div class="footer-contacts">
        <a href="https://t.me/sweet_toys_uz" class="contact-link" target="_blank">✈️ @sweet_toys_uz</a>
        <a href="tel:+998909088824" class="contact-link">📞 +998 90 908-88-24</a>
    </div>
    <p style="margin-top: 20px; color: #999; font-size: 0.8rem;">© 2026 Sweet Toys. Качество и радость в каждом заказе.</p>
</footer>

<div id="myModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="imgFull">
</div>

<script>
    function changeImg(smallImg) {
        const fullImg = smallImg.parentElement.parentElement.querySelector(".main-img");
        fullImg.src = smallImg.src;
    }
    function openModal(src) {
        document.getElementById("myModal").style.display = "flex";
        document.getElementById("imgFull").src = src;
    }
    function closeModal() {
        document.getElementById("myModal").style.display = "none";
    }
    window.onclick = function(event) {
        if (event.target == document.getElementById("myModal")) { closeModal(); }
    }
</script>

</body>
</html>
