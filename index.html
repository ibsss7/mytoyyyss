<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Toy Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🧸 Market Toys</h1>
</header>

<div class="container">
    <div class="catalog">

        <div class="product-card">
            <div class="image-box">
                <img src="photosss/toy1/toy1_1.jpg" class="main-img" onclick="openModal(this.src)" alt="Главное">
                <div class="thumbnails">
                    <img src="photosss/toy1/toy1_1.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_2.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_3.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_4.jpg" onclick="changeImg(this)">
                    <img src="photosss/toy1/toy1_5.jpg" onclick="changeImg(this)">
                </div>
            </div>
            <div class="product-info">
                <h3 class="product-title">Мягкий Мишка</h3>
                <p class="product-desc">Премиальное качество, гипоаллергенный наполнитель.</p>
                <div class="price">150 000 сум</div>
                <a href="https://wa.me/номер" class="buy-btn">В корзину</a>
            </div>
        </div>
        </div>
</div>

<div id="myModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="imgFull">
</div>

<script>
    // Функция смены главного фото в карточке
    function changeImg(smallImg) {
        // Находим главную картинку ИМЕННО в этой карточке
        const fullImg = smallImg.parentElement.parentElement.querySelector(".main-img");
        fullImg.src = smallImg.src;
    }

    // Функция открытия фото на весь экран
    function openModal(src) {
        document.getElementById("myModal").style.display = "flex";
        document.getElementById("imgFull").src = src;
    }

    function closeModal() {
        document.getElementById("myModal").style.display = "none";
    }
</script>

</body>
</html>
