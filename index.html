<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Toys — Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Sweet Toys</div>
</header>

<div class="container">
    <div class="catalog">
        <div class="product-card" onclick="openProduct('toy1', 'Gonchik moshina', 1000, ['3 yoshdan kattalar uchun', 'Material: Xavfsiz plastik', 'Og\'irligi: 50gram'], 5)">
            <div class="image-box">
                <img src="photosss/toy1/toy1_1.jpg" alt="Toy">
            </div>
            <div class="product-info-short">
                <div class="price">1 000 сум</div>
                <h3 class="product-title">Gonchik moshina</h3>
            </div>
        </div>

        <div class="product-card" onclick="openProduct('toy2', 'Mishka Teddy', 1000, ['Yumshoq material', 'Ranglari: jigarrang'], 3)">
            <div class="image-box">
                <img src="photosss/toy2/toy2_1.jpg" alt="Toy">
            </div>
            <div class="product-info-short">
                <div class="price">1 000 сум</div>
                <h3 class="product-title">Mishka Teddy</h3>
            </div>
        </div>
    </div>
</div>

<div id="productModal" class="modal-full">
    <div class="modal-content">
        <span class="close-btn" onclick="closeProduct()">&times;</span>
        
        <div class="modal-body">
            <img id="modal-main-img" src="" alt="Main View">
            
            <div id="modal-thumbnails" class="modal-thumbnails"></div>

            <h2 id="modal-title"></h2>
            
            <ul id="modal-features" class="product-features"></ul>
            
            <div class="qty-container">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <span id="modal-qty">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            
            <div class="modal-price"><span id="modal-total">1 000</span> сум</div>
            <a href="https://t.me/sweet_toys_uz" target="_blank" class="buy-btn">Sotib olish (Telegram)</a>
        </div>
    </div>
</div>

<script>
    let currentUnitPrice = 0;

    function openProduct(folder, title, price, features, imgCount) {
        currentUnitPrice = price;
        
        // Установка заголовка и цены
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-qty').innerText = '1';
        document.getElementById('modal-total').innerText = price.toLocaleString('ru-RU');
        
        // Установка главного фото
        const mainImg = document.getElementById('modal-main-img');
        mainImg.src = `photosss/${folder}/${folder}_1.jpg`;

        // Генерация миниатюр (листалка фото)
        const thumbContainer = document.getElementById('modal-thumbnails');
        thumbContainer.innerHTML = '';
        for (let i = 1; i <= imgCount; i++) {
            let img = document.createElement('img');
            img.src = `photosss/${folder}/${folder}_${i}.jpg`;
            img.onclick = function() { mainImg.src = this.src; };
            thumbContainer.appendChild(img);
        }

        // Генерация характеристик
        const featList = document.getElementById('modal-features');
        featList.innerHTML = '';
        features.forEach(text => {
            let li = document.createElement('li');
            li.innerText = text;
            featList.appendChild(li);
        });

        document.getElementById('productModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeProduct() {
        document.getElementById('productModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function changeQty(delta) {
        const qtySpan = document.getElementById('modal-qty');
        let qty = parseInt(qtySpan.innerText) + delta;
        if (qty < 1) qty = 1;
        qtySpan.innerText = qty;
        
        const total = qty * currentUnitPrice;
        document.getElementById('modal-total').innerText = total.toLocaleString('ru-RU');
    }

    // Закрытие при клике по фону
    window.onclick = function(event) {
        const modal = document.getElementById('productModal');
        if (event.target == modal) closeProduct();
    }
</script>

</body>
</html>
